<html lang="en"><head>

<title>Steez – Build outfits from independent brands</title>

<style>
:root{--bg:#f6f7ff;--card:#fff;--ink:#12142b;--mute:#6a6f88;--line:#e2e5f5;--ac:#2f3bff;--ai:#fff;--pop:#ffd84d;--dot:#d6daf0;--tile:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0d0f1f;--card:#161933;--ink:#eef0ff;--mute:#9da3c4;--line:#272b4d;--ac:#7b85ff;--ai:#0d0f1f;--dot:#272b4d;--tile:#e9ebf7}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;font-weight:600;font-size:13px;cursor:pointer;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;transition:transform .12s,border-color .15s}
button:active{transform:scale(.96)}button.go,a.cta{background:var(--ac);color:var(--ai);border-color:var(--ac)}button:disabled{opacity:.5}
input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:10px 15px;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.05em;color:var(--ink);text-decoration:none}.logo i{font-style:normal;color:var(--ac)}
a.cta{display:inline-block;text-decoration:none;font-weight:600;padding:15px 30px;border-radius:999px;transition:transform .15s}a.cta:hover{transform:translateY(-2px)}
.W{max-width:1100px;margin:0 auto;padding:0 20px}
#hnav{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.hero{text-align:center;padding:48px 0 40px;background:radial-gradient(520px 260px at 85% 0,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),radial-gradient(460px 240px at 8% 12%,color-mix(in srgb,var(--pop) 35%,transparent),transparent 70%)}
.hero h1{font-size:clamp(40px,9vw,84px);font-weight:800;letter-spacing:-.05em;line-height:.98;margin:0 auto 16px;max-width:13ch}
mark{background:linear-gradient(transparent 60%,var(--pop) 60%);color:inherit}
.hero p{color:var(--mute);font-size:clamp(16px,2.4vw,20px);max-width:46ch;margin:0 auto 26px}
.sec{padding:44px 0}.sec h2{font-size:clamp(28px,4.5vw,42px);letter-spacing:-.04em;line-height:1.05;margin:0 0 8px}.sec>.W>p{color:var(--mute);max-width:56ch;margin:0 0 24px}
.g3,.g4{display:grid;gap:14px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}

.box{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:22px}

.box h3{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}.box p{margin:0;color:var(--mute);font-size:15px}
.band{background:var(--ac);color:var(--ai);border-radius:32px;padding:44px 24px;text-align:center;margin:20px 0 10px}
.band h2{margin:0 0 10px;font-size:clamp(28px,5vw,44px);letter-spacing:-.04em}.band p{margin:0 auto 22px;max-width:44ch;opacity:.9}
.band a.cta{background:var(--pop);color:#12142b;border-color:var(--pop)}
footer{padding:30px 0 40px;color:var(--mute);font-size:13px;border-top:1px solid var(--line);margin-top:30px}
footer .W{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}footer p{margin:0;max-width:60ch}
#top{position:fixed;inset:0 0 auto;height:calc(52px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;padding-inline:12px;background:var(--card);border-bottom:1px solid var(--line)}
.gr{flex:1}#who{font-size:12px;color:var(--mute);max-width:26vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#shade{position:fixed;inset:0;z-index:44;background:rgba(10,12,30,.35)}
#menu{position:fixed;top:0;bottom:0;left:0;width:240px;z-index:45;background:var(--card);border-right:1.5px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;display:flex;flex-direction:column;gap:6px}
#menu a{display:block;padding:12px 14px;border-radius:14px;color:var(--ink);text-decoration:none;font-weight:600}#menu a.on{background:var(--bg)}#menu .logo{padding:0 14px 12px;display:block}
#authForm{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:10px;z-index:40;width:min(320px,94vw);display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--card);border:1.5px solid var(--line);border-radius:18px}#authMsg{margin:0;font-size:12px;color:var(--mute)}
#board{position:fixed;inset:calc(52px + env(safe-area-inset-top,0px)) 0 0 0;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.3px);background-size:24px 24px;overscroll-behavior:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.piece{position:absolute;left:0;top:0;width:300px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;transition:opacity .25s}
.piece.busy{opacity:.6}.piece img{width:100%;display:block;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 8px 10px rgba(18,20,43,.25));animation:pop .28s ease-out}

.piece.drag img{filter:none}
.piece .x,.piece .r{position:absolute;top:-6px;width:28px;height:28px;padding:0;display:none;line-height:1;background:var(--ac);color:var(--ai);border-color:var(--ac)}
.piece .x{right:-6px}.piece .r{left:-6px}.piece.sel .x,.piece.sel.has .r{display:block}
#hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);pointer-events:none;padding:20px}
#zoom{position:fixed;right:12px;top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;z-index:20}#zoom button{width:42px;height:42px;padding:0;font-size:20px}
#panel{position:fixed;left:12px;top:calc(64px + env(safe-area-inset-top,0px));bottom:12px;width:360px;max-width:calc(100vw - 24px);z-index:20;display:flex;flex-direction:column;gap:12px;padding:16px;background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 60px rgba(18,20,43,.16);transition:opacity .2s}
#panel.dim{opacity:.3}#panel>*{min-width:0}#panel .ph{display:flex;justify-content:space-between;align-items:center;font-size:17px;letter-spacing:-.02em}
#panel input{background:var(--bg);border:none;border-radius:16px;padding:12px 15px;font-size:14px}#f{display:flex;gap:8px}#f input{flex:1}#f button{border-radius:16px}#q{width:100%}
.rail{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap;padding:7px 13px;border:none;background:transparent;color:var(--mute)}.chip small{opacity:.55;margin-left:5px;font-weight:400}.chip.on{background:var(--ink);color:var(--bg)}
#list{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.card{min-width:0;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card .t{background:var(--tile);border-radius:20px;padding:12px;box-shadow:0 1px 2px rgba(18,20,43,.06);transition:transform .15s,box-shadow .15s}
